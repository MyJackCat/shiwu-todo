<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>待办提醒</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .card {
        margin: 8px;
        height: calc(100% - 16px);
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 13px 15px 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.97);
        border: 1px solid #e6e3dc;
        box-shadow: 0 18px 46px rgba(20, 18, 14, 0.28);
        backdrop-filter: blur(20px);
      }
      .head {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #5450e0;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .head svg {
        flex: none;
      }
      .grow {
        flex: 1;
      }
      .close {
        border: none;
        background: transparent;
        color: #8b8780;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 6px;
      }
      .close:hover {
        background: #f0eeea;
        color: #1e1d1a;
      }
      .title {
        font-size: 16px;
        font-weight: 650;
        line-height: 1.35;
        color: #1e1d1a;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
      }
      .body {
        font-size: 12.5px;
        color: #8b8780;
        overflow-wrap: anywhere;
      }
      .actions {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      button.action {
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        padding: 7px 11px;
        border-radius: 9px;
        border: 1px solid #d6d1c8;
        background: transparent;
        color: #1e1d1a;
      }
      button.action:hover {
        background: #f4f2ee;
      }
      button.primary {
        background: #5450e0;
        border-color: #5450e0;
        color: #fff;
        font-weight: 600;
      }
      button.primary:hover {
        filter: brightness(1.07);
        background: #5450e0;
      }
      button.link {
        margin-left: auto;
        border-color: transparent;
        color: #8b8780;
      }
      .bar {
        height: 3px;
        margin-top: 7px;
        border-radius: 99px;
        background: #eeece7;
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 100%;
        background: #5450e0;
      }
      @media (prefers-color-scheme: dark) {
        .card {
          background: rgba(32, 31, 28, 0.97);
          border-color: #3a3833;
          box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55);
        }
        .head {
          color: #8f8bff;
        }
        .title {
          color: #f0ede6;
        }
        .body,
        .link {
          color: #9a958c;
        }
        button.action {
          border-color: #403c35;
          color: #f0ede6;
        }
        button.action:hover {
          background: #2a2823;
        }
        button.primary {
          background: #8f8bff;
          border-color: #8f8bff;
          color: #17161a;
        }
        button.primary:hover {
          background: #8f8bff;
        }
        .close:hover {
          background: #2a2823;
          color: #f0ede6;
        }
        .bar {
          background: #2f2d28;
        }
        .bar span {
          background: #8f8bff;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="head">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8" />
          <path d="M13.7 21a2 2 0 0 1-3.4 0" />
        </svg>
        <span>待办提醒</span>
        <span class="grow"></span>
        <button class="close" id="close" title="关闭">×</button>
      </div>
      <div class="title" id="title">待办提醒</div>
      <div class="body" id="body"></div>
      <div class="actions">
        <button class="action primary" id="complete">完成</button>
        <button class="action" id="snooze">稍后 10 分钟</button>
        <button class="action link" id="open">打开</button>
      </div>
      <div class="bar"><span id="bar"></span></div>
    </div>
    <script>
      const api = window.reminder;
      const titleEl = document.getElementById('title');
      const bodyEl = document.getElementById('body');
      const bar = document.getElementById('bar');

      api.onData((data) => {
        titleEl.textContent = data.title || '待办提醒';
        bodyEl.textContent = data.body || '';
        bar.style.transition = 'none';
        bar.style.width = '100%';
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            bar.style.transition = 'width 60s linear';
            bar.style.width = '0%';
          });
        });
      });

      document.getElementById('complete').addEventListener('click', () => api.action('complete'));
      document.getElementById('snooze').addEventListener('click', () => api.action('snooze'));
      document.getElementById('open').addEventListener('click', () => api.action('open'));
      document.getElementById('close').addEventListener('click', () => api.action('dismiss'));
    </script>
  </body>
</html>
